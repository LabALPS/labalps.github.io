<!-- Links in navbar, a destra vicino alla search -->
<style>
  .navbar .navbar-nav {
    margin-left: auto;   /* spinge i link a destra */
    gap: .75rem;
  }
  .navbar .navbar-nav .nav-link { padding: .25rem .5rem; }
</style>

<script>
(function () {
  // aggiunge i link quando la navbar è disponibile (anche se viene montata dopo)
  function addLinks() {
    var nav = document.querySelector('.navbar .navbar-nav');
    if (!nav) return false;

    var items = [
      { t: 'Laboratory', h: '{{ "/laboratory/" | relative_url }}' },
      { t: 'Research',   h: '{{ "/research/"   | relative_url }}' },
      { t: 'Members',    h: '{{ "/members/"    | relative_url }}' }
    ];

    items.forEach(function (it) {
      if (nav.querySelector('a[href="' + it.h + '"]')) return; // evita duplicati
      var li = document.createElement('li'); li.className = 'nav-item';
      var a  = document.createElement('a'); a.className = 'nav-link'; a.href = it.h; a.textContent = it.t;
      li.appendChild(a); nav.appendChild(li);
    });
    return true;
  }

  if (!addLinks()) {
    var tries = 0, timer = setInterval(function () {
      if (addLinks() || ++tries > 50) clearInterval(timer); // ritenta per ~5s
    }, 100);
  }
})();
</script>
