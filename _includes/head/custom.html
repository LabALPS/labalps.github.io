 "name":"ALPS – Alpine Laboratory of Phonetic Sciences",

 "logo":"https://labalps.github.io/assets/img/ALPS_logo_transparent_scada_resized2.png"}

<style>
    .navbar .navbar-nav { gap: .75rem; }
    .navbar .navbar-nav .nav-link { padding: .25rem .25rem; }
  </style>
  
  <script>
  document.addEventListener('DOMContentLoaded', function () {
    const links = [
      { title: 'Laboratory', href: '{{ "/laboratory/" | relative_url }}' },
      { title: 'Research',   href: '{{ "/research/"   | relative_url }}' },
      { title: 'Members',    href: '{{ "/members/"    | relative_url }}' },
    ];
  
    const collapse = document.querySelector('.navbar .navbar-collapse, .navbar-collapse');
    let nav = document.querySelector('.navbar .navbar-nav');
  
    if (!nav && collapse) {
      nav = document.createElement('ul');
      nav.className = 'navbar-nav ms-auto ml-auto'; // ms-auto (BS5) / ml-auto (BS4)
      const icons = document.querySelector('.navbar .navbar-icons, .navbar .navbar-right');
      if (icons) {
        collapse.insertBefore(nav, icons);
      } else {
        collapse.appendChild(nav);
      }
    }
  
    if (!nav) return;
  
    nav.classList.add('ms-auto', 'ml-auto');
  
    const hasHref = (h) => !!nav.querySelector(`a[href="${h}"]`);
  
    links.forEach(({ title, href }) => {
      if (hasHref(href)) return;
      const li = document.createElement('li');
      li.className = 'nav-item';
      const a = document.createElement('a');
      a.className = 'nav-link';
      a.href = href;
      a.textContent = title;
      li.appendChild(a);
      nav.appendChild(li);
    });
  });
  </script>
