<style>
    #navbarNav .custom-links { gap:.75rem; }
    #navbarNav .custom-links .nav-link { padding:.25rem .5rem; }
    @media (max-width: 575.98px){
      #navbarNav .custom-links { display:none !important; }
    }
  </style>
  
  <script>
  (function addTopLinks(){
    
    var collapse = document.querySelector('#navbarNav');
    if (!collapse) return setTimeout(addTopLinks, 50);
  
    var list = collapse.querySelector('.navbar-nav');
    if (!list) {
      list = document.createElement('ul');
      list.className = 'navbar-nav ml-auto flex-nowrap';
      collapse.appendChild(list);
    }
  

    if (collapse.querySelector('.custom-links')) return;
  
    var links = [
      { text:'Laboratory',   href:'{{ "/laboratory/"   | relative_url }}' },
      { text:'Research',     href:'{{ "/research/"     | relative_url }}' },
      { text:'Members',      href:'{{ "/members/"      | relative_url }}' },
      { text:'Publications', href:'{{ "/publications/" | relative_url }}' },
    ];
  
    var ul = document.createElement('ul');
    ul.className = 'navbar-nav ml-auto flex-nowrap custom-links';
  
    links.forEach(function(item){
      if (collapse.querySelector('a.nav-link[href="'+item.href+'"]')) return;
      var li = document.createElement('li');
      li.className = 'nav-item';
      var a = document.createElement('a');
      a.className = 'nav-link';
      a.href = item.href;
      a.textContent = item.text;
      li.appendChild(a);
      ul.appendChild(li);
    });
  
    var searchBtn = collapse.querySelector('#search-toggle');
    var insertBefore = searchBtn ? searchBtn.closest('li') : null;
    if (insertBefore && insertBefore.parentElement === collapse.querySelector('.navbar-nav')) {
      insertBefore.parentElement.insertBefore(ul, insertBefore);
    } else {
      list.appendChild(ul);
    }
  })();
  </script>
